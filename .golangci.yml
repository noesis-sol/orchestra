# golangci-lint v2: the linters the Uber Go style guide asks for, plus predeclared, modernize and errorlint.
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - forbidigo # in cmd/orchestra's tests only (below)
    - govet
    - lll
    - modernize
    - predeclared
    - revive # its default rules
    - staticcheck
  settings:
    forbidigo:
      # cmd/orchestra's tests run in parallel, each orchestra in an environment of its own (test_env_test.go):
      # what reads the process's instead finds the machine's tools, and a test passes or skips on one machine
      # and not another. A deliberate use, such as an opt-in switch for a live test, says why in a nolint.
      forbid:
        - pattern: ^(t|tb|b)\.Context$
          msg: "runs orchestra's commands in the process's environment: use runCtx(t), or testCtx"
        - pattern: ^exec\.LookPath$
          msg: "reads the process's PATH: use command.LookPath with runCtx(t), or realGit"
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: "reads the process's environment: use getenv(t) or lookupEnv"
    lll:
      line-length: 120 # a ceiling; the Uber guide's 99 is the goal where it reads naturally
    errcheck:
      exclude-functions: # terminal writes
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
    errorlint:
      errorf: false # some fmt.Errorf calls format a second error with %v on purpose: only one is the cause
      comparison: true # errors.Is, not ==
      asserts: true # errors.As, not a type assertion or switch
    staticcheck:
      checks: # golangci-lint's defaults, without the De Morgan rewrite: the negated forms read better
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
  exclusions:
    rules:
      # forbidigo's rules are for cmd/orchestra's tests (above).
      - path-except: ^cmd/orchestra/.*_test\.go$
        linters: [forbidigo]
      # The test fakes implement interfaces whose arguments they mostly ignore.
      - path: _test\.go
        linters: [revive]
        text: "^unused-parameter:"
      # The line limit is for production code.
      - path: _test\.go
        linters: [lll]
      # A URL can't be wrapped.
      - source: "https?://"
        linters: [lll]

formatters:
  enable:
    - goimports
