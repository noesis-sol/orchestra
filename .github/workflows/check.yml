# Runs scripts/check.sh, the project's full check (go vet, the race tests, golangci-lint), on Linux
# and macOS for each push to main and each pull request: orchestra runs the check on the machine it
# runs on, macOS so far, and ships Linux binaries too. Both install tmux and require the tests that run
# it; macOS also installs cmux and requires the tests that run it. docs/development.md (Continuous
# integration).
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its running check; main's pushes are each checked.
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false # a failure on one system says nothing about the other
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The Go of go.mod: its toolchain line.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The real-tmux tests (internal/tmux's TestLive…, internal/dispatch's TestTmuxRun…) skip without
      # tmux, so the runner gets it, and ORCHESTRA_REQUIRE_TMUX=1 fails them rather than skip. Their
      # servers are detached, so the runner's lack of a terminal (and of TERM) is no matter.
      - name: Install tmux
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then
              HOMEBREW_NO_AUTO_UPDATE=1 brew install tmux # the runner's formulae are recent enough
            else
              sudo apt-get update && sudo apt-get install -y tmux
            fi
          fi
          tmux -V

      # The real-cmux tests (internal/cmux's TestLive…, internal/dispatch's TestCmuxRun…, cmd/orchestra's
      # TestCmux… in cmux) start the cmux app, macOS only, with a home folder of their own and its socket
      # open to any process (internal/cmuxtest); ORCHESTRA_REQUIRE_CMUX=1 fails them rather than skip.
      # The cask is the current cmux, as users update to it; the log says which.
      - name: Install cmux
        if: runner.os == 'macOS'
        run: |
          brew install --cask cmux
          xattr -dr com.apple.quarantine /Applications/cmux.app || true # started from the test, not Finder
          /Applications/cmux.app/Contents/Resources/bin/cmux version

      - name: Check
        run: scripts/check.sh
        env:
          ORCHESTRA_REQUIRE_TMUX: "1"
          ORCHESTRA_REQUIRE_CMUX: ${{ runner.os == 'macOS' && '1' || '' }}
